<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>WebAR - Rotating Red Box</title>

  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- AR.js Library -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    .instructions {
      position: fixed;
      top: 15px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 16px;
      z-index: 10;
      text-shadow: 1px 1px 3px black;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="instructions">
    Point your camera at the Hiro marker
  </div>

  <!-- WebAR Scene -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Hiro Marker -->
    <a-marker preset="hiro">

      <!-- Rotating Red Box -->
      <a-box
        position="0 0.5 0"
        rotation="0 0 0"
        scale="1 1 1"
        material="color: #ff0000; opacity: 0.8; roughness: 0.5;"
        animation="
          property: rotation;
          to: 0 360 0;
          loop: true;
          dur: 3000;
          easing: linear;">
      </a-box>

    </a-marker>

    <!-- AR Camera -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
